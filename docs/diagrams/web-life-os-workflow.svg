    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1400" height="860" fill="#F8FAFC" rx="16" />
  <rect width="1400" height="860" fill="url(#w-grid)" rx="16" />

  <!-- Diagram Header Bar -->
  <g transform="translate(40, 24)">
