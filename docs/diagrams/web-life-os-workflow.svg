    <rect x="1170" y="12" width="136" height="28" rx="6" fill="#F5F3FF" stroke="#DDD6FE" />
    <text x="1182" y="30" fill="#6D28D9" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">● REACT 19 SPA</text>
