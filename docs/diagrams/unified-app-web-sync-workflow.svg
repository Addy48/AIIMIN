      <rect x="14" y="62" width="360" height="126" rx="4" fill="#14171A" stroke="#262B33" />
      <text x="20" y="82" fill="#F0EDE8" font-family="'JetBrains Mono', monospace" font-size="9">habits (user_id, name, cadence, meta)</text>
