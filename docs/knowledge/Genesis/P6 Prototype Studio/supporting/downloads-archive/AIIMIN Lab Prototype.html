<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AIIMIN — Lab interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Inter, sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="variants/lab-prototype.jsx"></script>

<script type="text/babel" data-presets="react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "menuVariant": "quiet",
    "startTab": 0
  }/*EDITMODE-END*/;

  const App = () => {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [activeTab, setActiveTab] = React.useState(t.startTab ?? 0);
    const [labOpen, setLabOpen] = React.useState(false);

    return (
      <>
        <LabPrototype
          theme={t.theme}
          variant={t.menuVariant}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          labOpen={labOpen}
          setLabOpen={setLabOpen}
        />
        <TweaksPanel title="Tweaks">
          <TweakSection label="Theme" />
          <TweakRadio
            label="Palette"
            value={t.theme}
            options={['light', 'dark']}
            onChange={(v) => setTweak('theme', v)}
          />

          <TweakSection label="Lab menu" />
          <TweakSelect
            label="Variant"
            value={t.menuVariant}
            options={[
              { value: 'mega',    label: '03 — Mega · three-column' },
              { value: 'quiet',   label: '01 — Quiet · ledger' },
              { value: 'index',   label: '02 — Index · table-of-contents' },
              { value: 'palette', label: '04 — Palette · command bar' },
            ]}
            onChange={(v) => setTweak('menuVariant', v)}
          />
          <TweakButton label="Open Lab menu" onClick={() => setLabOpen(true)} />
          <TweakButton label="Close Lab menu" onClick={() => setLabOpen(false)} />

          <TweakSection label="Active tab" />
          <TweakSelect
            label="Jump to"
            value={String(activeTab)}
            options={[
              { value: '0', label: 'Today' },
              { value: '1', label: 'Skills' },
              { value: '2', label: 'Insights' },
              { value: '3', label: 'Calendar' },
              { value: '4', label: 'Finance' },
              { value: '5', label: 'Reports' },
            ]}
            onChange={(v) => { setActiveTab(parseInt(v, 10)); setLabOpen(false); }}
          />
        </TweaksPanel>
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
