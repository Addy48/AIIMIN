
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans);}
.root{padding:1rem 0;display:flex;flex-direction:column;gap:16px;}
.tabs{display:flex;gap:6px;}
.tab{padding:6px 18px;font-size:13px;border-radius:20px;border:0.5px solid rgba(128,128,128,0.25);cursor:pointer;font-family:var(--font-sans);transition:all 0.12s;background:transparent;color:var(--color-text-secondary);}
.tab.active{background:var(--color-text-primary);color:var(--color-background-primary);}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.card{border-radius:10px;overflow:hidden;cursor:pointer;border:1.5px solid transparent;transition:border-color 0.12s;}
.card.sel{border-color:var(--color-text-primary);}
.card-top{padding:14px;display:flex;flex-direction:column;gap:10px;}
.card-name{font-size:12px;font-weight:500;}
.card-sub{font-size:10px;opacity:0.5;}
.swatch-row{display:flex;gap:5px;}
.swatch{width:18px;height:18px;border-radius:4px;}
.mini-ui{display:flex;gap:6px;align-items:center;}
.mini-pill{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:500;}
.mini-stat{font-size:16px;font-weight:600;}
.mini-muted{font-size:9px;opacity:0.45;}
.card-bottom{padding:8px 14px;font-size:10px;opacity:0.45;border-top:0.5px solid rgba(128,128,128,0.12);}
.preview-wrap{border-radius:10px;overflow:hidden;border:0.5px solid rgba(128,128,128,0.15);}
.pv-top{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:0.5px solid rgba(128,128,128,0.1);}
.pv-logo{font-size:14px;font-weight:600;letter-spacing:0.04em;}
.pv-body{display:flex;min-height:160px;}
.pv-sidebar{width:130px;flex-shrink:0;padding:12px 8px;border-right:0.5px solid rgba(128,128,128,0.1);display:flex;flex-direction:column;gap:3px;}
.pv-nav{padding:6px 8px;border-radius:5px;font-size:11px;display:flex;align-items:center;gap:6px;}
.pv-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.pv-main{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;}
.pv-statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.pv-stat{border-radius:6px;padding:10px;border:0.5px solid rgba(128,128,128,0.1);}
.pv-sl{font-size:9px;opacity:0.4;margin-bottom:4px;}
.pv-sv{font-size:16px;font-weight:600;}
.pv-ss{font-size:9px;margin-top:2px;}
.pv-table{border-radius:6px;border:0.5px solid rgba(128,128,128,0.1);overflow:hidden;}
.pv-th{display:grid;grid-template-columns:2fr 1fr 1fr;padding:5px 10px;font-size:9px;opacity:0.3;letter-spacing:0.06em;text-transform:uppercase;border-bottom:0.5px solid rgba(128,128,128,0.08);}
.pv-tr{display:grid;grid-template-columns:2fr 1fr 1fr;padding:6px 10px;font-size:10px;border-bottom:0.5px solid rgba(128,128,128,0.07);}
.pv-tr:last-child{border-bottom:none;}
.pv-badge{font-size:8px;padding:2px 6px;border-radius:8px;font-weight:500;}
.css-box{border-radius:8px;padding:12px 14px;font-family:var(--font-mono);font-size:10px;line-height:1.9;white-space:pre;border:0.5px solid rgba(128,128,128,0.12);}
.copy-btn{padding:6px 16px;font-size:12px;border-radius:6px;border:0.5px solid rgba(128,128,128,0.2);cursor:pointer;font-family:var(--font-sans);transition:opacity 0.1s;}
</style>

<div class="root">
<div style="display:flex;align-items:center;justify-content:space-between;">
  <div class="tabs">
    <button class="tab active" id="tDark" onclick="switchMode('dark')">Dark</button>
    <button class="tab" id="tLight" onclick="switchMode('light')">Light</button>

  <span style="font-size:11px;color:var(--color-text-secondary);opacity:0.5">Click a theme to preview</span>

<div class="grid" id="themeGrid"></div>

<div id="previewSection" style="display:none;flex-direction:column;gap:10px;">

      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;">

    <button class="copy-btn" id="copyBtn" onclick="copyCSS()" style="color:var(--color-text-primary);background:var(--color-background-secondary)">Copy</button>
  </div>
  <div class="css-box" id="cssBox" style="color:var(--color-text-secondary);background:var(--color-background-secondary)"></div>
</div>
</div>

let mode = 'dark';
let selIdx = 0;

function switchMode(m) {
  mode = m;
  selIdx = 0;
  document.getElementById('tDark').classList.toggle('active', m==='dark');
  document.getElementById('tLight').classList.toggle('active', m==='light');
  renderGrid();
  renderPreview(0);
}

function renderGrid() {
  const themes = mode==='dark' ? dark : light;
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  themes.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i===selIdx?' sel':'');
    card.style.background = t.card;
    card.style.borderColor = i===selIdx ? t.accent : 'transparent';
    card.onclick = () => { selIdx=i; renderGrid(); renderPreview(i); };

    card.innerHTML = `
      <div class="card-top" style="background:${t.bg}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div class="card-name" style="color:${t.text}">${t.name}</div>
            <div class="card-sub" style="color:${t.muted}">${t.sub}</div>
          </div>
          <div style="width:10px;height:10px;border-radius:50%;background:${t.accent}"></div>
        </div>
        <div class="swatch-row">
          <div class="swatch" style="background:${t.bg};border:0.5px solid rgba(128,128,128,0.15)"></div>
          <div class="swatch" style="background:${t.card};border:0.5px solid rgba(128,128,128,0.15)"></div>
          <div class="swatch" style="background:${t.text}"></div>
          <div class="swatch" style="background:${t.accent}"></div>
          <div class="swatch" style="background:${t.pos}"></div>
          <div class="swatch" style="background:${t.neg}"></div>
        </div>
        <div class="mini-ui" style="color:${t.text}">
          <span class="mini-stat" style="color:${t.accent}">₹2.4L</span>
          <span class="mini-muted" style="color:${t.muted}">net worth</span>
          <span class="mini-pill" style="background:${t.accentM};color:${t.accent}">+3.2%</span>
        </div>
      </div>
      <div class="card-bottom" style="background:${t.bg};color:${t.muted}">${t.name} — click to preview</div>
    `;
    grid.appendChild(card);
  });
}

function renderPreview(i) {
  const themes = mode==='dark' ? dark : light;
  const t = themes[i];
  const pv = document.getElementById('previewSection');
  pv.style.display = 'flex';

  document.getElementById('pvWrap').style.background = t.bg;
  document.getElementById('pvWrap').style.color = t.text;
  document.getElementById('pvTop').style.background = t.bg;
  document.getElementById('pvTop').style.borderBottomColor = t.bdr;
  document.getElementById('pvLogo').style.color = t.text;
  document.getElementById('pvDate').style.color = t.muted;
  document.getElementById('pvSidebar').style.background = t.sb;
  document.getElementById('pvSidebar').style.borderRightColor = t.bdr;
  document.getElementById('pvNavActive').style.background = t.accentM;
  document.getElementById('pvNavActive').style.color = t.accent;
  document.getElementById('pvDot').style.background = t.accent;
  ['pvNavMuted','pvNavMuted2','pvNavMuted3'].forEach(id=>{
    document.getElementById(id).style.color = t.muted;
  });
  document.getElementById('pvMain').style.background = t.bg;
  ['pvStat1','pvStat2','pvStat3'].forEach(id=>{
    const el = document.getElementById(id);
    el.style.background = t.card;
    el.style.borderColor = t.bdr;
  });
  ['pvSl1','pvSl2','pvSl3'].forEach(id=>{ document.getElementById(id).style.color = t.muted; });
  ['pvSv1','pvSv2','pvSv3'].forEach(id=>{ document.getElementById(id).style.color = t.text; });
  document.getElementById('pvSsPos').style.color = t.pos;
  document.getElementById('pvSsMut').style.color = t.muted;
  document.getElementById('pvSsNeg').style.color = t.neg;
  document.getElementById('pvTable').style.background = t.card;
  document.getElementById('pvTable').style.borderColor = t.bdr;
  ['pvTr1','pvTr2','pvTr3'].forEach(id=>{ document.getElementById(id).style.color = t.text; });
  document.getElementById('pvB1').style.background = t.b1bg;
  document.getElementById('pvB1').style.color = t.b1c;
  document.getElementById('pvB2').style.background = t.b2bg;
  document.getElementById('pvB2').style.color = t.b2c;
  document.getElementById('pvB3').style.background = t.b3bg;
  document.getElementById('pvB3').style.color = t.b3c;

  const vars = `--bg-primary:   ${t.bg};\n--bg-secondary: ${t.sb};\n--bg-card:      ${t.card};\n--border:       ${t.bdr};\n--text:         ${t.text};\n--muted:        ${t.muted};\n--accent:       ${t.accent};\n--accent-muted: ${t.accentM};\n--positive:     ${t.pos};\n--negative:     ${t.neg};`;
  document.getElementById('cssBox').textContent = vars;
  document.getElementById('cssBox').setAttribute('data-vars', vars);
}

function copyCSS() {
  const text = document.getElementById('cssBox').getAttribute('data-vars');
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied';
    setTimeout(()=>{ btn.textContent = 'Copy'; }, 1500);
  });
}

renderGrid();
renderPreview(0);
</script>
