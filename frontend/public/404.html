<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Surface Not Found | AIIMIN</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 4vw, 48px);
      text-align: center;
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ff6b35;
      background: rgba(255, 107, 53, 0.08);
      border: 1px solid rgba(255, 107, 53, 0.25);
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #a1a1aa;
      font-size: 15px;
      max-width: 460px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 11px 22px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #ff6b35;
      color: #000000;
    }
    .btn-primary:hover {
      background: #ff7d4d;
    }
    .btn-secondary {
      background: #08090c;
      color: #f4f4f6;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: #11141a;
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="badge">Status 404 · Signal Lost</div>
  <h1>Surface Not Found</h1>
  <p>The coordinate you requested does not exist in the AIIMIN Life OS network. Return to the command center or join the founding waitlist.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">Return to AIIMIN</a>
    <a href="/waitlist" class="btn btn-secondary">Join Waitlist</a>
  </div>
</body>
</html>
