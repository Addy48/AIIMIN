# Tuned for an 8 GB machine with swap already under pressure: small Gradle heap,
# small Kotlin daemon, no parallel project execution, at most two workers.
# Raise these on CI (GitHub Actions runners have 16 GB).
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# Compose preview screenshot tests — render proof on the JVM, no device needed.
android.experimental.enableScreenshotTest=true
kotlin.code.style=official

# Compose compiler diagnostics — off by default, they cost build time.
# enableComposeCompilerMetrics=true
# enableComposeCompilerReports=true
